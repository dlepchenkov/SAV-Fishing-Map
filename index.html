<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Gewässerkarte SAV Hemelingen</title>
  <!-- ?v= bei jeder Änderung an style.css/map.js hochzählen: Cloudflare cacht .css/.js bis zu 4 h -->
  <link rel="stylesheet" href="style.css?v=2">
  <!-- Mapbox-Token (nicht im Repo): config.js, Vorlage config.example.js -->
  <script src="config.js" onerror="window.MAPBOX_TOKEN=''"></script>
</head>
<body>
  <aside id="panel">
    <h1>Gewässerkarte<br><span>SAV Hemelingen</span></h1>

    <div class="basemap">
      <button data-base="plan" class="active">Karte</button>
      <button data-base="luftbild">Luftbild</button>
    </div>

    <section id="gruppen"></section>
    <ul id="liste"></ul>

    <p class="hinweis-klein">Prototyp · Umrisse: © OpenStreetMap contributors (ODbL).
      Angaben ohne Gewähr – maßgeblich sind Erlaubnisschein und Gewässerordnung.</p>
    <p id="engine" class="hinweis-klein"></p>
  </aside>
  <div id="map"></div>
  <script src="map.js?v=2"></script>
</body>
</html>
